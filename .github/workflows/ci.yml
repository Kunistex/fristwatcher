name: CI und Deployment

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Tests (PHP 8.3, MariaDB)
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, gd, intl, bcmath, gmp, zip
          coverage: none

      - name: Composer-Cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('composer.json', 'composer.lock') }}

      - name: Abhängigkeiten installieren
        run: composer install --no-interaction --prefer-dist --no-progress && touch .env

      - name: Tests
        env:
          DB_CONNECTION: mariadb
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: testing
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan test

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Assets bauen
        run: npm ci && npm run build

  deploy:
    name: Deployment per FTP
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
      DEPLOY_HOOK_TOKEN: ${{ secrets.DEPLOY_HOOK_TOKEN }}
      APP_URL: ${{ secrets.APP_URL }}

    steps:
      - name: Secrets prüfen
        id: check
        run: |
          missing=""
          for v in FTP_SERVER FTP_USERNAME FTP_PASSWORD FTP_SERVER_DIR DEPLOY_HOOK_TOKEN APP_URL; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::warning::Deployment übersprungen, fehlende Secrets:$missing"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif [ ${#DEPLOY_HOOK_TOKEN} -lt 32 ]; then
            echo "::error::DEPLOY_HOOK_TOKEN muss mindestens 32 Zeichen haben."
            exit 1
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      - uses: shivammathur/setup-php@v2
        if: steps.check.outputs.ready == 'true'
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, gd, intl, bcmath, gmp, zip
          coverage: none

      - name: Produktions-Abhängigkeiten
        if: steps.check.outputs.ready == 'true'
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist --no-progress

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Assets bauen
        if: steps.check.outputs.ready == 'true'
        run: npm ci && npm run build && rm -rf node_modules

      - name: Upload per FTP (lftp, verschlüsselt)
        if: steps.check.outputs.ready == 'true'
        env:
          FTP_PROTOCOL: ${{ secrets.FTP_PROTOCOL || 'ftps' }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp > /dev/null
          DIR="${FTP_SERVER_DIR%/}"; [ -z "$DIR" ] && DIR="/"
          if [ "$FTP_PROTOCOL" = "ftp" ]; then TLS="set ftp:ssl-allow false;"; else TLS="set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate true;"; fi
          EXCL="--exclude-glob .git/ --exclude-glob .github/ --exclude-glob node_modules/ --exclude-glob tests/ --exclude-glob .env --exclude-glob storage/ --exclude-glob vendor/ --exclude-glob .editorconfig --exclude-glob phpunit.xml"
          export LFTP_PASSWORD="$FTP_PASSWORD"
          lftp --env-password -u "$FTP_USERNAME" "$FTP_SERVER" <<LFTP
          set cmd:fail-exit true; set net:max-retries 3; set net:timeout 30; set net:reconnect-interval-base 5
          $TLS
          set ftp:passive-mode true
          mkdir -p -f "$DIR"
          cd "$DIR"
          mkdir -p -f storage/app/private storage/app/public storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs storage/fonts
          mirror -R --parallel=6 --ignore-time --verbose=1 vendor vendor
          mirror -R --parallel=6 --verbose=1 $EXCL . .
          bye
          LFTP
      - name: Migrationen und Caches auf dem Server
        if: steps.check.outputs.ready == 'true'
        run: |
          code=$(curl -sS --max-time 300 -o hook.log -w '%{http_code}' -X POST -H "X-Deploy-Token: $DEPLOY_HOOK_TOKEN" "${APP_URL%/}/_deploy" || echo 000)
          echo "HTTP $code"
          head -c 6000 hook.log | sed -E 's/(PASSWORD|password)[^[:space:]]*/\1=***/g'
          [ "$code" = "200" ] || { echo "::error::/_deploy antwortete mit HTTP $code"; exit 1; }
